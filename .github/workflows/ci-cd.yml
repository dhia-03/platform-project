name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write
  issues: write   # ✅ required if ZAP tries to open issues

env:
  IMAGE_NAME: ghcr.io/dhia-03/platform-project
  DAST_TARGET: http://18.234.84.25:3000

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Secret scanning
      # =========================
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 3. Docker build setup
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # 4. Login to GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 5. Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 6. Trivy filesystem scan
      # =========================
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 0

      # =========================
      # 7. Trivy image scan
      # =========================
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # =========================
      # 8. Verify remote application
      # =========================
      - name: Verify remote application
        run: |
          curl -I ${{ env.DAST_TARGET }}

      # =========================
      # 9. OWASP ZAP DAST Scan (FIXED)
      # =========================
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.DAST_TARGET }}
          fail_action: false
          cmd_options: "-a"
          allow_issue_writing: false   # 🔥 IMPORTANT FIX

      # =========================
      # 10. Upload ZAP report
      # =========================
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json

      # =========================
      # 11. Push Docker image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 12. Checkout GitOps repo
      # =========================
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: dhia-03/platform-gitops
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      # =========================
      # 13. Checkov scan
      # =========================
      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: gitops/app/
          framework: kubernetes
          soft_fail: true
          skip_check: CKV_K8S_40

      # =========================
      # 14. Update GitOps repo
      # =========================
      - name: Update GitOps Repo
        run: |
          cd gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          sed -i "s|image: .*platform-project:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" app/platform-app/deployment.yaml

          git add .

          git commit -m "chore: update image to ${{ github.sha }} [skip ci]" || echo "No changes"

          git push
