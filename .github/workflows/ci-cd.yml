name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/dhia-03/platform-project

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout source code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. SECRET SCANNING (NEW 🔐)
      # Detect leaked tokens, passwords, keys
      # =========================
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 3. SETUP DOCKER BUILDX
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # 4. LOGIN TO GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 5. BUILD IMAGE
      # =========================
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 6. FILE SYSTEM SECURITY SCAN (NEW 🔍)
      # scans dependencies before push
      # =========================
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 0

      # =========================
      # 7. CONTAINER IMAGE SCAN (STRICT MODE 🔥)
      # fails pipeline on HIGH/CRITICAL issues
      # =========================
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # =========================
      # 8. PUSH IMAGE TO GHCR
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 9. KUBERNETES MANIFEST SCAN (NEW 🧱)
      # detects insecure configs
      # =========================
      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: app/

      # =========================
      # 10. UPDATE GITOPS REPO (ARGOCD TRIGGER)
      # =========================
      - name: Update GitOps Repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/dhia-03/platform-gitops.git
          cd platform-gitops

          sed -i "s|image: .*platform-project:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" app/platform-app/deployment.yaml

          git add .

          git commit -m "chore: update image to ${{ github.sha }} [skip ci]" || echo "No changes"

          git push https://x-access-token:${GITOPS_TOKEN}@github.com/dhia-03/platform-gitops.git main
