name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/dhia-03/platform-project

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Secret scanning
      # =========================
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 3. Docker build setup
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # 4. Login to GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 5. Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 6. Trivy filesystem scan
      # =========================
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 0

      # =========================
      # 7. Run temporary container
      # =========================
      - name: Run temporary container
        run: |
          docker run -d \
            --name test-app \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # =========================
      # 8. Wait for app startup
      # =========================
      - name: Wait for startup
        run: sleep 30

      # =========================
      # 9. DAST Scan with OWASP ZAP
      # =========================
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          fail_action: false

      # =========================
      # 10. Cleanup test container
      # =========================
      - name: Cleanup container
        run: |
          docker stop test-app
          docker rm test-app

      # =========================
      # 11. Upload ZAP report
      # =========================
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

      # =========================
      # 12. Trivy image scan
      # =========================
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # =========================
      # 13. Push Docker image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 14. Checkout GitOps repository
      # =========================
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: dhia-03/platform-gitops
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      # =========================
      # 15. Checkov Kubernetes scan
      # =========================
      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: gitops/app/
          framework: kubernetes
          soft_fail: true
          skip_check: CKV_K8S_40

      # =========================
      # 16. Update GitOps repository
      # =========================
      - name: Update GitOps Repo
        run: |
          cd gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          sed -i "s|image: .*platform-project:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" app/platform-app/deployment.yaml

          git add .

          git commit -m "chore: update image to ${{ github.sha }} [skip ci]" || echo "No changes"

          git push
