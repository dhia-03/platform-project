name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/dhia-03/platform-project

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout CI repository (code)
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Secret scanning (security)
      # =========================
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 3. Docker build setup
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # 4. Login to GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 5. Build image
      # =========================
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 6. Trivy filesystem scan
      # =========================
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 0

      # =========================
      # 7. Trivy image scan (security gate)
      # =========================
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # =========================
      # 8. Push image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # =========================
      # 9. Checkout GitOps repo (IMPORTANT FIX)
      # =========================
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: dhia-03/platform-gitops
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      # =========================
      # 10. FIXED CHECKOV SCAN (NOW WORKS)
      # =========================
      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: gitops/app/
          framework: kubernetes
          soft_fail: true
          skip_check: CKV_K8S_40

      # =========================
      # 11. Update GitOps repo (ArgoCD trigger)
      # =========================
      - name: Update GitOps Repo
        run: |
          cd gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          sed -i "s|image: .*platform-project:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" app/platform-app/deployment.yaml

          git add .

          git commit -m "chore: update image to ${{ github.sha }} [skip ci]" || echo "No changes"

          git push
