name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write
  issues: write

env:
  IMAGE_NAME: ghcr.io/dhia-03/platform-project
  DAST_TARGET: http://34.226.190.157:3000

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 0

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Verify remote application
        run: curl -I ${{ env.DAST_TARGET }}

      # =========================
      # 9. OWASP ZAP Baseline Scan (MANUAL FIX)
      # =========================
      - name: OWASP ZAP Baseline Scan
        run: |
          # Create reports files and set permissions
          touch report_json.json report_md.md report_html.html
          chmod a+w report_json.json report_md.md report_html.html
          
          # Run ZAP via Docker directly to bypass the buggy Action wrapper
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t ${{ env.DAST_TARGET }} \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a || echo "ZAP found issues, continuing..."

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            report_json.json
            report_md.md
            report_html.html

      # =========================
      # 10. Push Docker image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: dhia-03/platform-gitops
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: gitops/app/
          framework: kubernetes
          soft_fail: true
          skip_check: CKV_K8S_40

      - name: Update GitOps Repo
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          sed -i "s|image: .*platform-project:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" app/platform-app/deployment.yaml
          git add .
          git commit -m "chore: update image to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push
